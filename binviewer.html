<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bin Viewer - Achievement Editor</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1b23;
    --border: #2a2b35;
    --text: #e1e2e6;
    --text-dim: #888;
    --accent: #5b8def;
    --accent-hover: #7aa2f7;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --orange: #d4782f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }

  .drop-zone {
    flex: 1;
    min-width: 150px;
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-dim);
    position: relative;
    transition: all .2s;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(91,141,239,.08);
  }
  .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  .stats {
    display: flex;
    gap: 16px;
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  .stats .stat { white-space: nowrap; }
  .stats .stat b { font-weight: 600; }
  .stat-total b { color: var(--text); }
  .stat-hidden b { color: var(--yellow); }
  .stat-visible b { color: var(--green); }

  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .search-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 10px;
    color: var(--text);
    font-size: 12px;
    flex: 1;
    min-width: 140px;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .filter-bar label {
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-bar input[type="checkbox"] { accent-color: var(--accent); }
  .btn {
    background: var(--border);
    border: none;
    border-radius: 5px;
    color: var(--text);
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background .2s;
    white-space: nowrap;
  }
  .btn:hover { background: #3a3b45; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-green { background: var(--green); color: #fff; }
  .btn-green:hover { background: #4cda64; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { background: #ff6b63; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .table-wrap {
    overflow: auto;
    flex: 1;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    white-space: nowrap;
  }
  thead { position: sticky; top: 0; z-index: 1; }
  th {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
  }
  th:hover { color: var(--accent); }
  th .sort-arrow { margin-left: 3px; opacity: .3; font-size: 10px; }
  th.sorted .sort-arrow { opacity: 1; }
  td {
    padding: 5px 8px;
    border-bottom: 1px solid rgba(42,43,53,.5);
  }
  tr:hover td { background: rgba(91,141,239,.06); }
  tr.edited td { background: rgba(210,153,34,.08); }
  tr.hidden-row td:first-child { border-left: 3px solid var(--yellow); padding-left: 5px; }
  .modified-badge {
    display: inline-block;
    background: var(--orange);
    color: #fff;
    font-size: 10px;
    padding: 0 5px;
    border-radius: 3px;
    font-weight: 600;
    margin-left: 4px;
  }
  .hidden-badge {
    display: inline-block;
    background: var(--yellow);
    color: #000;
    font-size: 10px;
    padding: 0 5px;
    border-radius: 3px;
    font-weight: 600;
  }
  .ordinal { color: var(--text-dim); font-size: 11px; }
  .desc-cell { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
  .no-data, .empty-filter {
    padding: 50px 20px; text-align: center; color: var(--text-dim); font-size: 14px;
  }

  /* === Detail/Edit Panel === */
  .detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .detail-overlay.open { display: flex; }
  .detail-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    max-width: 540px;
    width: 92%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .detail-panel h2 { font-size: 16px; margin-bottom: 2px; }
  .detail-panel .ord-tag { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; }

  .edit-field {
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .edit-field:last-of-type { border: none; }
  .edit-field .label {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text-dim);
    letter-spacing: .5px;
    margin-bottom: 2px;
  }
  .edit-field .value {
    font-size: 13px;
    word-break: break-all;
  }
  .edit-field input, .edit-field textarea, .edit-field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  .edit-field input:focus, .edit-field textarea:focus { border-color: var(--accent); }
  .edit-field textarea { resize: vertical; min-height: 36px; }

  .detail-buttons {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .detail-buttons .btn { flex: 1; padding: 7px; font-size: 13px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.success { border-color: var(--green); }
  .toast.error { border-color: var(--red); }

  /* Language bar */
  .lang-bar {
    display: flex;
    gap: 6px;
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .lang-bar .label {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    margin-right: 4px;
  }
  .lang-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 10px;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .lang-btn:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  .lang-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .lang-btn.add-lang {
    border-style: dashed;
    color: var(--accent);
  }
  .lang-btn .rm-lang {
    margin-left: 5px;
    opacity: .5;
    font-size: 10px;
  }
  .lang-btn .rm-lang:hover { opacity: 1; }
  .lang-custom-input {
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    color: var(--text);
    font-size: 11px;
    width: 90px;
    outline: none;
  }
  .lang-custom-input:focus { border-color: var(--accent); }

  /* Column selector modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 150;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    max-width: 440px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-panel h3 {
    font-size: 14px;
    margin-bottom: 12px;
  }
  .col-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 14px;
  }
  .col-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    padding: 3px 0;
  }
  .col-item input[type="checkbox"] { accent-color: var(--accent); }
  .modal-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .modal-buttons .btn { flex: 1; min-width: 60px; padding: 7px; font-size: 13px; }

  @media (max-width: 640px) {
    .header { padding: 10px 12px; }
    .stats { padding: 6px 12px; font-size: 11px; gap: 10px; }
    .filter-bar { padding: 6px 12px; }
    .detail-panel { padding: 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>&#9745; Bin Editor</h1>
  <div class="drop-zone" id="dropZone">
    点击选择 .bin 文件，或拖拽到此处
    <input type="file" id="fileInput" accept=".bin">
  </div>
  <button class="btn btn-green" id="saveBtn" disabled>&#128190; 另存为</button>
</div>

<div class="stats">
  <span class="stat stat-total">总计: <b id="statTotal">-</b></span>
  <span class="stat stat-visible">可见: <b id="statVisible">-</b></span>
  <span class="stat stat-hidden">隐藏: <b id="statHidden">-</b></span>
  <span class="stat" style="color:var(--text-dim)">|</span>
  <span class="stat">已修改: <b id="statModified">0</b></span>
  <span class="stat">文件: <b id="statFile">-</b></span>
  <span class="stat">大小: <b id="statSize">-</b></span>
</div>

<div class="filter-bar">
  <input class="search-input" id="searchInput" placeholder="搜索..." spellcheck="false">
  <label><input type="checkbox" id="showHidden" checked> 隐藏</label>
  <label><input type="checkbox" id="showNoIcon"> 无图标</label>
  <label><input type="checkbox" id="showModified" checked> 已修改</label>
  <label><input type="checkbox" id="groupByOrdinal"> 分组</label>
  <button class="btn" id="exportBtn">&#128196; 导出 CSV</button>
<button class="btn" id="importBtn">&#128194; 导入 CSV</button>
<input type="file" id="importFileInput" accept=".csv" style="display:none">
  <button class="btn" id="resetBtn" disabled>&#8634; 重置</button>
</div>

<div class="lang-bar" id="langBar">
  <span class="label">语言:</span>
</div>

<div class="table-wrap" id="tableWrap">
  <table>
    <thead id="tableHead"></thead>
    <tbody id="tableBody">
      <tr><td colspan="7"><div class="no-data">选择一个 .bin 文件来查看和编辑成就数据</div></td></tr>
    </tbody>
  </table>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel">
    <h2 id="detailName"></h2>
    <div class="ord-tag">#<span id="detailOrdinal"></span></div>

    <div class="edit-field">
      <div class="label">显示名称</div>
      <input id="editDisplayName" data-field="displayName">
    </div>
    <div id="langEditFields"></div>
    <div class="edit-field">
      <div class="label">Token</div>
      <input id="editToken" data-field="token">
    </div>
    <div class="edit-field">
      <div class="label">描述</div>
      <textarea id="editDescription" data-field="description" rows="2"></textarea>
    </div>
    <div class="edit-field">
      <div class="label">描述 Token</div>
      <input id="editDescToken" data-field="descToken">
    </div>
    <div class="edit-field">
      <div class="label"><label><input type="checkbox" id="editHidden"> 隐藏成就</label></div>
    </div>
    <div class="edit-field">
      <div class="label">图标</div>
      <input id="editIcon" data-field="icon">
    </div>
    <div class="edit-field">
      <div class="label">灰色图标</div>
      <input id="editIconGray" data-field="iconGray">
    </div>

    <div class="detail-buttons">
      <button class="btn btn-primary" id="detailApply">&#10003; 应用</button>
      <button class="btn" id="detailPrev">&#9664; 上一条</button>
      <button class="btn" id="detailNext">下一条 &#9654;</button>
      <button class="btn" id="detailClose">关闭</button>
    </div>
  </div>
</div>

<!-- Column selector modal -->
<div class="modal-overlay" id="colModal">
  <div class="modal-panel">
    <h3>选择导出列</h3>
    <div class="col-list" id="colList"></div>
    <div class="modal-buttons">
      <button class="btn btn-primary" id="colExport">导出选中列</button>
      <button class="btn" id="colCancel">取消</button>
    </div>
  </div>
</div>

<!-- CSV import preview -->
<div class="modal-overlay" id="importModal">
  <div class="modal-panel" style="text-align:center">
    <h3>导入 CSV</h3>
    <p id="importMsg" style="font-size:13px;margin:12px 0;color:var(--text-dim)"></p>
    <div class="modal-buttons">
      <button class="btn btn-primary" id="importConfirm">确认导入</button>
      <button class="btn" id="importCancel">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// Constants
// ============================================================

const COMMON_LANGUAGES = [
  { code: 'schinese', label: '简体中文' },
  { code: 'tchinese', label: '繁體中文' },
  { code: 'japanese', label: '日本語' },
  { code: 'korean', label: '한국어' },
  { code: 'french', label: 'Français' },
  { code: 'german', label: 'Deutsch' },
  { code: 'spanish', label: 'Español' },
  { code: 'portuguese', label: 'Português' },
  { code: 'russian', label: 'Русский' },
  { code: 'italian', label: 'Italiano' },
  { code: 'dutch', label: 'Nederlands' },
  { code: 'polish', label: 'Polski' },
  { code: 'brazilian', label: 'Português (Brasil)' },
  { code: 'latam', label: 'Español (LATAM)' },
  { code: 'turkish', label: 'Türkçe' },
  { code: 'ukrainian', label: 'Українська' },
  { code: 'thai', label: 'ไทย' },
  { code: 'vietnamese', label: 'Tiếng Việt' },
  { code: 'arabic', label: 'العربية' },
];

const $ = id => document.getElementById(id);
const tbody = $('tableBody');
const thead = $('tableHead');

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}

// ============================================================
// Binary Helpers
// ============================================================

function skipToNull(buf, pos) {
  while (pos < buf.length && buf[pos] !== 0) pos++;
  return pos;
}

function skipNonStructural(buf, pos) {
  while (pos < buf.length) {
    if (buf[pos] === 0x08) { pos++; continue; }
    if (buf[pos] === 0x00) { pos++; continue; }
    if (buf[pos] >= 0x30 && buf[pos] <= 0x39) {
      while (pos < buf.length && buf[pos] >= 0x30 && buf[pos] <= 0x39) pos++;
      if (buf[pos] === 0x00) pos++;
      if (buf[pos] === 0x01) pos++;
      continue;
    }
    break;
  }
  return pos;
}

function matchAt(buf, pos, pattern) {
  if (pos + pattern.length > buf.length) return false;
  for (let i = 0; i < pattern.length; i++) {
    if (buf[pos + i] !== pattern[i]) return false;
  }
  return true;
}

function decode(buf, start, end) {
  return new TextDecoder().decode(buf.slice(start, end));
}

function concatArrays(arrays) {
  let len = 0;
  for (const a of arrays) len += a.length;
  const r = new Uint8Array(len);
  let off = 0;
  for (const a of arrays) { r.set(a, off); off += a.length; }
  return r;
}

// ============================================================
// Parser — dynamically collects all language fields
// ============================================================

function parseAchievements(data) {
  const buf = new Uint8Array(data);
  const achievements = [];
  let pos = 0;

  // Find first "name\x00<digit>"
  const firstPos = findFirstRecord(buf, 0);
  if (firstPos === -1) throw new Error('No achievement records found');
  pos = firstPos;

  let consecutiveFails = 0;
  while (pos < buf.length && consecutiveFails < 3) {
    pos = skipNonStructural(buf, pos);
    if (pos >= buf.length) break;

    if (!matchAt(buf, pos, [0x6E, 0x61, 0x6D, 0x65, 0x00])) {
      consecutiveFails++; pos++; continue;
    }
    consecutiveFails = 0;
    pos += 5;

    // Ordinal
    let ord = '';
    while (pos < buf.length && buf[pos] >= 0x30 && buf[pos] <= 0x39) {
      ord += String.fromCharCode(buf[pos]); pos++;
    }
    const ordinal = parseInt(ord, 10);
    if (buf[pos] === 0x00) pos++;
    if (buf[pos] === 0x00) pos++;

    let displayName = '', token = '', description = '', descToken = '';
    let hidden = false, icon = '', iconGray = '';
    const langDisplay = {};
    const langDesc = {};

    // --- Display section ---
    if (buf[pos] === 0x64) { // 'd'
      pos += 7; // "display"
      if (buf[pos] === 0x00) pos++;
      if (buf[pos] === 0x00) pos++;
      if (buf[pos] === 0x6E) pos += 4; // "name"
      if (buf[pos] === 0x00) pos++;
      if (buf[pos] === 0x01) pos++;
      pos = skipToNull(buf, pos) + 1; // skip "english\x00"
      const nameStart = pos;
      pos = skipToNull(buf, pos) + 1;
      displayName = decode(buf, nameStart, pos - 1);
    }

    // Parse token + language sub-fields in display section
    while (pos < buf.length && buf[pos] === 0x01) {
      pos++; // skip \x01
      const tagStart = pos;
      pos = skipToNull(buf, pos);
      if (pos >= buf.length) break;
      const tag = decode(buf, tagStart, pos);
      pos++; // skip \x00 after tag
      if (pos >= buf.length) break;
      const valStart = pos;
      pos = skipToNull(buf, pos);
      const val = decode(buf, valStart, pos);
      pos++; // skip \x00 after value
      if (tag === 'token') token = val;
      else langDisplay[tag] = val;
    }

    if (buf[pos] === 0x08) pos++;
    if (buf[pos] === 0x00) pos++;

    // --- Description section ---
    if (buf[pos] === 0x64 && buf[pos+1] === 0x65 && buf[pos+2] === 0x73 && buf[pos+3] === 0x63) {
      pos += 4; // "desc"
      if (buf[pos] === 0x00) pos++;
      if (buf[pos] === 0x01) pos++;
      pos = skipToNull(buf, pos) + 1; // skip "english\x00"
      const descStart = pos;
      pos = skipToNull(buf, pos) + 1;
      description = decode(buf, descStart, pos - 1);
    }

    // Parse descToken + language sub-fields in desc section
    while (pos < buf.length && buf[pos] === 0x01) {
      pos++; // skip \x01
      const tagStart = pos;
      pos = skipToNull(buf, pos);
      if (pos >= buf.length) break;
      const tag = decode(buf, tagStart, pos);
      pos++; // skip \x00 after tag
      if (pos >= buf.length) break;
      const valStart = pos;
      pos = skipToNull(buf, pos);
      const val = decode(buf, valStart, pos);
      pos++; // skip \x00 after value
      if (tag === 'token') descToken = val;
      else langDesc[tag] = val;
    }

    if (buf[pos] === 0x08) pos++;
    if (buf[pos] === 0x00 || buf[pos] === 0x01 || buf[pos] === 0x02) pos++;

    // hidden field
    if (buf[pos] === 0x68 && buf[pos+1] === 0x69) {
      pos += 6; // "hidden"
      if (buf[pos] === 0x00) pos++;
      hidden = buf[pos] === 0x01 || buf[pos] === 0x31; // \x01 or ASCII '1'
      pos++;
      while (pos < buf.length && !(buf[pos] === 0x69 && (buf[pos+4] === 0x00 || buf[pos+4] === 0x5F))) {
        pos++;
      }
    }

    // icon / icon_gray (order varies across records)
    while (pos < buf.length && buf[pos] === 0x01) pos++;
    if (matchAt(buf, pos, [0x69, 0x63, 0x6F, 0x6E, 0x5F, 0x67, 0x72, 0x61, 0x79, 0x00])) {
      pos += 10;
      const igStart = pos;
      pos = skipToNull(buf, pos) + 1;
      iconGray = decode(buf, igStart, pos - 1);
      if (buf[pos] === 0x01) pos++;
    }
    if (matchAt(buf, pos, [0x69, 0x63, 0x6F, 0x6E, 0x00])) {
      pos += 5;
      const iconStart = pos;
      pos = skipToNull(buf, pos) + 1;
      icon = decode(buf, iconStart, pos - 1);
      if (buf[pos] === 0x01) pos++;
    }
    if (matchAt(buf, pos, [0x69, 0x63, 0x6F, 0x6E, 0x5F, 0x67, 0x72, 0x61, 0x79, 0x00])) {
      pos += 10;
      const igStart = pos;
      pos = skipToNull(buf, pos) + 1;
      iconGray = decode(buf, igStart, pos - 1);
    }

    achievements.push({ ordinal, displayName, token, description, descToken, hidden, icon, iconGray, langDisplay, langDesc });

    // Advance to next record
    let found = false;
    let sp = pos;
    while (sp < buf.length - 6) {
      if (buf[sp] === 0x08) { sp++; continue; }
      if (buf[sp] === 0x00) { sp++; continue; }
      if (matchAt(buf, sp, tAchBytes) && decode(buf, sp, sp+15) === 'type\x00ACHIEVEMENTS') {
        sp += 5; sp = skipToNull(buf, sp) + 1;
        if (buf[sp] === 0x02) sp++;
        sp += 8;
        if (buf[sp] === 0x00) sp++;
        sp += 4;
        if (buf[sp] === 0x00) sp++;
        if (buf[sp] === 0x08) sp++;
        if (buf[sp] === 0x00) sp++;
        while (sp < buf.length && buf[sp] >= 0x30 && buf[sp] <= 0x39) sp++;
        if (buf[sp] === 0x00) sp++;
        if (buf[sp] === 0x00) sp++;
        if (buf[sp] === 0x62) sp += 4;
        if (buf[sp] === 0x00) sp++;
        if (buf[sp] === 0x00) sp++;
        if (buf[sp] === 0x30) sp++;
        if (buf[sp] === 0x00) sp++;
        if (buf[sp] === 0x00) sp++;
        if (buf[sp] === 0x01) sp++;
        continue;
      }
      if (buf[sp] === 0x6E && decode(buf, sp, sp+5) === 'name\x00') {
        if (buf[sp+5] >= 0x30 && buf[sp+5] <= 0x39) { found = true; break; }
      }
      sp++;
    }
    if (!found) break;
    pos = sp;
  }
  return achievements;
}

const tAchBytes = [0x74, 0x79, 0x70, 0x65, 0x00, 0x41, 0x43, 0x48, 0x49, 0x45, 0x56, 0x45, 0x4D, 0x45, 0x4E, 0x54, 0x53, 0x00];

function findFirstRecord(buf, start) {
  for (let i = start; i < buf.length - 6; i++) {
    if (matchAt(buf, i, [0x6E, 0x61, 0x6D, 0x65, 0x00]) && buf[i+5] >= 0x30 && buf[i+5] <= 0x39) return i;
  }
  return -1;
}

function findNextRecord(buf, start) {
  return findFirstRecord(buf, start);
}

function findSectionMarkers(u8) {
  const markers = [];
  for (let i = 0; i <= u8.length - 20; i++) {
    if (u8[i] !== 0x08 || u8[i+1] !== 0x08 || u8[i+2] !== 0x08 || u8[i+3] !== 0x01) continue;
    let match = true;
    const typeStr = 'type\x00ACHIEVEMENTS\x00';
    for (let j = 0; j < typeStr.length; j++) {
      if (u8[i + 4 + j] !== typeStr.charCodeAt(j)) { match = false; break; }
    }
    if (match) markers.push(i);
  }
  return markers;
}

// ============================================================
// Serializer — dynamically writes all language fields
// ============================================================

function serializeRecord(a, ordinalStr, tailPos, includeTail) {
  const enc = new TextEncoder();
  const parts = [];

  // name\x00<ordinal>\x00\x00
  parts.push(enc.encode('name\x00' + ordinalStr + '\x00\x00'));

  // display\x00\x00name\x00\x01english\x00<name>\x00
  parts.push(enc.encode('display\x00\x00name\x00\x01english\x00' + (a.displayName || '') + '\x00'));

  // token sub-field
  parts.push(enc.encode('\x01token\x00' + (a.token || '') + '\x00'));

  // All display language sub-fields
  if (a.langDisplay) {
    for (const [lang, val] of Object.entries(a.langDisplay)) {
      if (val) parts.push(enc.encode('\x01' + lang + '\x00' + val + '\x00'));
    }
  }

  // \x08\x00
  parts.push(new Uint8Array([0x08, 0x00]));

  // desc\x00\x01english\x00<desc>\x00\x01token\x00<descToken>\x00
  parts.push(enc.encode('desc\x00\x01english\x00' + (a.description || '') + '\x00\x01token\x00' + (a.descToken || '') + '\x00'));

  // All description language sub-fields
  if (a.langDesc) {
    for (const [lang, val] of Object.entries(a.langDesc)) {
      if (val) parts.push(enc.encode('\x01' + lang + '\x00' + val + '\x00'));
    }
  }

  // \x08\x02 (separator before hidden field)
  parts.push(new Uint8Array([0x08, 0x02]));

  // hidden\x00<flag>\x00\x00\x00\x01 (binary flag, matching Steam's original format)
  parts.push(new Uint8Array([0x68, 0x69, 0x64, 0x64, 0x65, 0x6E, 0x00, a.hidden ? 0x01 : 0x00, 0x00, 0x00, 0x00, 0x01]));

  // icon\x00<path>\x00
  parts.push(enc.encode('icon\x00' + (a.icon || '') + '\x00'));

  // \x01
  parts.push(new Uint8Array([0x01]));

  // icon_gray\x00<path>\x00
  parts.push(enc.encode('icon_gray\x00' + (a.iconGray || '') + '\x00'));

  // Tail: \x08\x08\x00<position>\x00\x01 (omitted for last record per section)
  if (includeTail !== false) {
    parts.push(enc.encode('\x08\x08\x00' + tailPos + '\x00\x01'));
  }

  return concatArrays(parts);
}



function rebuildFile(origBuf, achievements) {
  const u8 = new Uint8Array(origBuf);
  const markers = findSectionMarkers(u8);
  if (markers.length < 21) throw new Error('Expected 21 section markers, found ' + markers.length);

  // Find all record positions in original file
  const allRecords = [];
  let pos = 0;
  while (pos < u8.length) {
    const idx = findFirstRecord(u8, pos);
    if (idx === -1) break;
    let op = idx + 5;
    let ord = '';
    while (op < u8.length && u8[op] >= 0x30 && u8[op] <= 0x39) { ord += String.fromCharCode(u8[op]); op++; }
    allRecords.push({ pos: idx, ordinal: parseInt(ord, 10) });
    pos = idx + 1;
  }

  // Group records into pre-section (before marker[0]) and sections 0-19
  const preRecords = [];
  const sectRecords = [];
  for (let si = 0; si < 20; si++) sectRecords.push([]);

  for (const r of allRecords) {
    if (r.pos < markers[0]) {
      preRecords.push(r);
    } else {
      for (let si = 0; si < 20; si++) {
        if (r.pos >= markers[si] && r.pos < markers[si + 1]) {
          sectRecords[si].push(r);
          break;
        }
      }
    }
  }

  const achMap = {};
  for (const a of achievements) achMap[a.ordinal] = a;

  const parts = [];

  // === PRE-SECTION: header + records before first ACHIEVEMENTS marker ===
  if (preRecords.length > 0) {
    parts.push(u8.slice(0, preRecords[0].pos));
    for (let i = 0; i < preRecords.length; i++) {
      const a = achMap[preRecords[i].ordinal];
      const isLast = i === preRecords.length - 1;
      const tailPos = i + 1; // 1-based position within pre-section group
      if (a) {
        parts.push(serializeRecord(a, String(preRecords[i].ordinal), String(tailPos), !isLast));
      } else {
        const nextStart = i + 1 < preRecords.length ? preRecords[i + 1].pos : markers[0];
        parts.push(u8.slice(preRecords[i].pos, nextStart));
      }
    }
  }

  // === CONTENT SECTIONS 0-19 (each with ACHIEVEMENTS envelope) ===
  for (let si = 0; si < 20; si++) {
    const recs = sectRecords[si];
    if (recs.length === 0) {
      parts.push(u8.slice(markers[si], markers[si + 1]));
      continue;
    }
    // Section prefix: marker → first record
    parts.push(u8.slice(markers[si], recs[0].pos));
    for (let i = 0; i < recs.length; i++) {
      const a = achMap[recs[i].ordinal];
      const isLast = i === recs.length - 1;
      const tailPos = i + 1; // 1-based position within section
      if (a) {
        parts.push(serializeRecord(a, String(recs[i].ordinal), String(tailPos), !isLast));
      } else {
        const nextStart = i + 1 < recs.length ? recs[i + 1].pos : markers[si + 1];
        parts.push(u8.slice(recs[i].pos, nextStart));
      }
    }
  }

  // === FOOTER (section 20, verbatim — no version normalization) ===
  parts.push(u8.slice(markers[20]));

  return concatArrays(parts);
}

// ============================================================
// UI State
// ============================================================

let originalData = null;
let allAchievements = [];
let originalSnapshot = [];
let filtered = [];
let sortCol = 'ordinal';
let sortAsc = true;
let detailIdx = -1;
let dirtyFlags = new Set();
let activeLanguages = ['schinese'];

// ============================================================
// Language Management
// ============================================================

function renderLangBar() {
  const bar = $('langBar');
  if (!bar) return;
  let html = '<span class="label">语言:</span>';
  for (const lang of COMMON_LANGUAGES) {
    const active = activeLanguages.includes(lang.code);
    html += '<button class="lang-btn' + (active ? ' active' : '') + '" data-lang="' + lang.code + '">' + esc(lang.label) + '</button>';
  }
  html += '<input class="lang-custom-input" id="customLangInput" placeholder="自定义" maxlength="20">';
  html += '<button class="lang-btn add-lang" id="addCustomLang">+</button>';
  bar.innerHTML = html;

  bar.querySelectorAll('.lang-btn[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => toggleLanguage(btn.dataset.lang));
  });
  const addBtn = $('addCustomLang');
  const langInput = $('customLangInput');
  if (addBtn) addBtn.addEventListener('click', () => {
    const input = $('customLangInput');
    if (!input) return;
    const code = input.value.trim().toLowerCase();
    if (code && /^[a-z_]+$/.test(code) && !activeLanguages.includes(code)) {
      toggleLanguage(code);
      input.value = '';
    } else if (activeLanguages.includes(code)) {
      toast('语言 ' + code + ' 已存在', 'error');
    } else {
      toast('请输入有效的语言代码（字母和下划线）', 'error');
    }
  });
  if (langInput) langInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const btn = $('addCustomLang');
      if (btn) btn.click();
    }
  });
}

function toggleLanguage(code) {
  const idx = activeLanguages.indexOf(code);
  if (idx >= 0) {
    activeLanguages.splice(idx, 1);
  } else {
    activeLanguages.push(code);
    // Initialize empty entries for all achievements
    for (const a of allAchievements) {
      if (a.langDisplay[code] === undefined) a.langDisplay[code] = '';
      if (a.langDesc[code] === undefined) a.langDesc[code] = '';
    }
  }
  buildTableHead();
  renderLangBar();
  renderLangEditFields();
  if (detailIdx >= 0) openDetail(detailIdx);
  applyFilters();
}

function detectLanguages() {
  const langSet = new Set();
  for (const a of allAchievements) {
    for (const l of Object.keys(a.langDisplay || {})) langSet.add(l);
    for (const l of Object.keys(a.langDesc || {})) langSet.add(l);
  }
  if (langSet.size > 0) {
    activeLanguages = Array.from(langSet);
  } else {
    // Default
    activeLanguages = ['schinese'];
  }
}

// ============================================================
// Column / Sort helpers
// ============================================================

function getColumns() {
  const cols = [
    { key: 'ordinal', label: '#' },
    { key: 'displayName', label: '名称' },
    { key: 'token', label: 'Token' },
    { key: 'description', label: '描述' },
    { key: 'hidden', label: '隐藏', width: '60px' },
    { key: 'icon', label: '图标' },
    { key: 'iconGray', label: '灰图标' },
  ];
  for (const lang of activeLanguages) {
    const info = COMMON_LANGUAGES.find(l => l.code === lang);
    const lbl = info ? info.label : lang;
    cols.push({ key: '__lang_disp_' + lang, label: lbl + ' 名称' });
    cols.push({ key: '__lang_desc_' + lang, label: lbl + ' 描述' });
  }
  return cols;
}

function getSortValue(a, col) {
  if (col === 'ordinal') return a.ordinal;
  if (col === 'hidden') return a.hidden ? 1 : 0;
  if (col.startsWith('__lang_disp_')) {
    const lang = col.slice('__lang_disp_'.length);
    return (a.langDisplay[lang] || '').toLowerCase();
  }
  if (col.startsWith('__lang_desc_')) {
    const lang = col.slice('__lang_desc_'.length);
    return (a.langDesc[lang] || '').toLowerCase();
  }
  return (a[col] || '').toLowerCase();
}

function buildTableHead() {
  const cols = getColumns();
  let html = '<tr>';
  for (const c of cols) {
    const cls = sortCol === c.key ? ' sorted' : '';
    const arrow = sortCol === c.key ? (sortAsc ? '&#9650;' : '&#9660;') : '&#9660;';
    const width = c.width ? ' style="width:' + c.width + '"' : '';
    html += '<th' + width + ' data-col="' + c.key + '" class="' + cls + '">' + esc(c.label) + '<span class="sort-arrow">' + arrow + '</span></th>';
  }
  html += '</tr>';
  thead.innerHTML = html;
}

// ============================================================
// Is-modified helper
// ============================================================

function isAchievementDirty(a, orig) {
  if (a.displayName !== orig.displayName) return true;
  if (a.token !== orig.token) return true;
  if (a.description !== orig.description) return true;
  if (a.descToken !== orig.descToken) return true;
  if (a.hidden !== orig.hidden) return true;
  if (a.icon !== orig.icon) return true;
  if (a.iconGray !== orig.iconGray) return true;
  // Compare langDisplay
  const allDispKeys = new Set([...Object.keys(a.langDisplay || {}), ...Object.keys(orig.langDisplay || {})]);
  for (const k of allDispKeys) {
    if ((a.langDisplay[k] || '') !== (orig.langDisplay[k] || '')) return true;
  }
  const allDescKeys = new Set([...Object.keys(a.langDesc || {}), ...Object.keys(orig.langDesc || {})]);
  for (const k of allDescKeys) {
    if ((a.langDesc[k] || '') !== (orig.langDesc[k] || '')) return true;
  }
  return false;
}

// ============================================================
// File IO
// ============================================================

$('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) loadFile(file);
});

const dropZone = $('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.bin')) loadFile(file);
  else toast('请选择 .bin 文件', 'error');
});

function loadFile(file) {
  $('statFile').textContent = file.name;
  $('statSize').textContent = formatSize(file.size);
  const reader = new FileReader();
  reader.onload = e => {
    try {
      originalData = new Uint8Array(e.target.result);
      allAchievements = parseAchievements(e.target.result);
      originalSnapshot = allAchievements.map(a => ({
        ...a,
        langDisplay: {...(a.langDisplay || {})},
        langDesc: {...(a.langDesc || {})}
      }));
      dirtyFlags.clear();
      detectLanguages();
      buildTableHead();
      renderLangBar();
      renderLangEditFields();
      $('saveBtn').disabled = false;
      $('resetBtn').disabled = true;
      applyFilters();
      toast('加载成功: ' + allAchievements.length + ' 条成就', 'success');
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="no-data">解析失败: ' + esc(err.message) + '</div></td></tr>';
      toast('解析失败: ' + err.message, 'error');
    }
  };
  reader.onerror = () => toast('读取文件失败', 'error');
  reader.readAsArrayBuffer(file);
}

// ============================================================
// Save (rebuild + download)
// ============================================================

$('saveBtn').addEventListener('click', () => {
  if (!originalData || allAchievements.length === 0) return;
  try {
    const rebuilt = rebuildFile(originalData, allAchievements);
    const blob = new Blob([rebuilt], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const fileName = $('statFile').textContent.replace(/\.bin$/, '') || 'achievements';
    a.href = url;
    a.download = fileName + '_modified.bin';
    a.click();
    URL.revokeObjectURL(url);
    toast('保存成功! 共 ' + allAchievements.length + ' 条记录', 'success');
  } catch (err) {
    toast('保存失败: ' + err.message, 'error');
  }
});

// ============================================================
// Reset
// ============================================================

$('resetBtn').addEventListener('click', () => {
  if (dirtyFlags.size === 0) return;
  allAchievements = originalSnapshot.map(a => ({
    ...a,
    langDisplay: {...(a.langDisplay || {})},
    langDesc: {...(a.langDesc || {})}
  }));
  dirtyFlags.clear();
  $('resetBtn').disabled = true;
  applyFilters();
  toast('已重置所有修改', 'success');
});

// ============================================================
// Filter & Sort & Render
// ============================================================

const colspanForEmpty = () => 7 + activeLanguages.length * 2;

function applyFilters() {
  const q = $('searchInput').value.toLowerCase().trim();
  const showHidden = $('showHidden').checked;
  const showNoIcon = $('showNoIcon').checked;
  const showModified = $('showModified').checked;

  filtered = allAchievements.filter((a, i) => {
    if (!showHidden && a.hidden) return false;
    if (!showNoIcon && a.icon) return false;
    if (!showModified && dirtyFlags.has(i)) return false;
    if (q) {
      const fields = [a.displayName, a.token, a.description];
      for (const v of Object.values(a.langDisplay || {})) fields.push(v);
      for (const v of Object.values(a.langDesc || {})) fields.push(v);
      if (!fields.some(f => f && f.toLowerCase().includes(q))) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    const va = getSortValue(a, sortCol);
    const vb = getSortValue(b, sortCol);
    if (typeof va === 'number') return sortAsc ? va - vb : vb - va;
    return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });

  updateStats();
  renderTable();
}

function updateStats() {
  const total = allAchievements.length;
  const hidden = allAchievements.filter(a => a.hidden).length;
  const visible = total - hidden;
  $('statTotal').textContent = total;
  $('statHidden').textContent = hidden;
  $('statVisible').textContent = visible;
  $('statModified').textContent = dirtyFlags.size;
  $('resetBtn').disabled = dirtyFlags.size === 0;
}

function renderTable() {
  const groupBy = $('groupByOrdinal').checked;
  const cols = colspanForEmpty();

  if (filtered.length === 0) {
    tbody.innerHTML = allAchievements.length === 0
      ? '<tr><td colspan="' + cols + '"><div class="no-data">选择一个 .bin 文件来查看和编辑成就数据</div></td></tr>'
      : '<tr><td colspan="' + cols + '"><div class="empty-filter">没有匹配的记录</div></td></tr>';
    return;
  }

  let html = '';
  if (groupBy) {
    const groups = {};
    filtered.forEach(a => {
      const g = Math.floor((a.ordinal - 1) / 10) * 10 + 1;
      const key = g + '-' + (g + 9);
      if (!groups[key]) groups[key] = [];
      groups[key].push(a);
    });
    for (const [range, items] of Object.entries(groups)) {
      html += '<tr style="background:var(--surface);font-weight:600"><td colspan="' + cols + '" style="padding:4px 8px;font-size:11px;color:var(--accent)">#' + range + '</td></tr>';
      html += items.map(a => rowHtml(a)).join('');
    }
  } else {
    html = filtered.map(a => rowHtml(a)).join('');
  }

  tbody.innerHTML = html;

  tbody.querySelectorAll('tr.data-row').forEach((tr, idx) => {
    const a = filtered[idx];
    const realIdx = allAchievements.indexOf(a);
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', () => openDetail(realIdx));
  });
}

function rowHtml(a) {
  const realIdx = allAchievements.indexOf(a);
  const isModified = dirtyFlags.has(realIdx);
  const cls = 'data-row' + (a.hidden ? ' hidden-row' : '') + (isModified ? ' edited' : '');
  const badges = (a.hidden ? '<span class="hidden-badge">隐藏</span> ' : '') + (isModified ? '<span class="modified-badge">已修改</span>' : '');
  let cells = '<td class="ordinal">' + a.ordinal + '</td>';
  cells += '<td>' + esc(a.displayName) + ' ' + badges + '</td>';
  cells += '<td style="font-size:11px;color:var(--text-dim)">' + esc(a.token) + '</td>';
  cells += '<td class="desc-cell">' + esc(a.description) + '</td>';
  cells += '<td>' + (a.hidden ? '&#10003;' : '') + '</td>';
  cells += '<td class="icon-cell" style="font-size:10px;color:var(--text-dim);max-width:180px;overflow:hidden;text-overflow:ellipsis">' + esc(a.icon) + '</td>';
  cells += '<td class="icon-cell" style="font-size:10px;color:var(--text-dim);max-width:180px;overflow:hidden;text-overflow:ellipsis">' + esc(a.iconGray) + '</td>';

  for (const lang of activeLanguages) {
    cells += '<td>' + esc(a.langDisplay[lang]) + '</td>';
    cells += '<td class="desc-cell">' + esc(a.langDesc[lang]) + '</td>';
  }

  return '<tr class="' + cls + '">' + cells + '</tr>';
}

// ============================================================
// Column Sorting
// ============================================================

$('tableHead').addEventListener('click', e => {
  const th = e.target.closest('th');
  if (!th) return;
  const col = th.dataset.col;
  if (!col) return;
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  buildTableHead(); // rebuild arrows
  applyFilters();
});

// ============================================================
// Filter event listeners
// ============================================================

['searchInput','showHidden','showNoIcon','showModified','groupByOrdinal'].forEach(id => {
  const el = $(id);
  if (el) el.addEventListener(id === 'searchInput' ? 'input' : 'change', applyFilters);
});

// ============================================================
// Detail / Edit Panel
// ============================================================

function renderLangEditFields() {
  const container = $('langEditFields');
  if (!container) return;
  let html = '';
  for (const lang of activeLanguages) {
    const info = COMMON_LANGUAGES.find(l => l.code === lang);
    const label = info ? info.label : lang;
    html += '<div class="edit-field"><div class="label">' + esc(label) + ' 名称</div><input id="editLangDisp_' + lang + '" data-lang-disp="' + lang + '"></div>';
    html += '<div class="edit-field"><div class="label">' + esc(label) + ' 描述</div><textarea id="editLangDesc_' + lang + '" data-lang-desc="' + lang + '" rows="2"></textarea></div>';
  }
  container.innerHTML = html;
}

function openDetail(idx) {
  if (idx < 0 || idx >= allAchievements.length) return;
  detailIdx = idx;
  const a = allAchievements[idx];
  $('detailName').textContent = a.displayName || '(unnamed)';
  $('detailOrdinal').textContent = a.ordinal;
  $('editDisplayName').value = a.displayName || '';
  $('editToken').value = a.token || '';
  $('editDescription').value = a.description || '';
  $('editDescToken').value = a.descToken || '';
  $('editHidden').checked = a.hidden;
  $('editIcon').value = a.icon || '';
  $('editIconGray').value = a.iconGray || '';

  for (const lang of activeLanguages) {
    const dispEl = document.getElementById('editLangDisp_' + lang);
    const descEl = document.getElementById('editLangDesc_' + lang);
    if (dispEl) dispEl.value = a.langDisplay[lang] || '';
    if (descEl) descEl.value = a.langDesc[lang] || '';
  }

  $('detailOverlay').classList.add('open');
}

function closeDetail() {
  $('detailOverlay').classList.remove('open');
  detailIdx = -1;
}

function applyEdit() {
  if (detailIdx < 0) return;
  const a = allAchievements[detailIdx];
  const orig = originalSnapshot[detailIdx];
  a.displayName = $('editDisplayName').value;
  a.token = $('editToken').value;
  a.description = $('editDescription').value;
  a.descToken = $('editDescToken').value;
  a.hidden = $('editHidden').checked;
  a.icon = $('editIcon').value;
  a.iconGray = $('editIconGray').value;

  for (const lang of activeLanguages) {
    const dispEl = document.getElementById('editLangDisp_' + lang);
    const descEl = document.getElementById('editLangDesc_' + lang);
    if (dispEl) a.langDisplay[lang] = dispEl.value;
    if (descEl) a.langDesc[lang] = descEl.value;
  }

  const changed = isAchievementDirty(a, orig);
  if (changed) dirtyFlags.add(detailIdx);
  else dirtyFlags.delete(detailIdx);

  applyFilters();
  $('detailName').textContent = a.displayName || '(unnamed)';
  toast('已更新 #' + a.ordinal, 'success');
}

function nextDetail() {
  if (detailIdx < 0) return;
  let next = detailIdx + 1;
  if (next >= allAchievements.length) next = 0;
  openDetail(next);
}

function prevDetail() {
  if (detailIdx < 0) return;
  let prev = detailIdx - 1;
  if (prev < 0) prev = allAchievements.length - 1;
  openDetail(prev);
}

$('detailApply').addEventListener('click', applyEdit);
$('detailPrev').addEventListener('click', prevDetail);
$('detailNext').addEventListener('click', nextDetail);
$('detailClose').addEventListener('click', closeDetail);
$('detailOverlay').addEventListener('click', e => {
  if (e.target === $('detailOverlay')) closeDetail();
});

$('detailOverlay').addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); applyEdit(); }
});

// ============================================================
// CSV Export with Column Selection
// ============================================================

function getAllExportColumns() {
  const cols = [
    { key: 'ordinal',      label: '#' },
    { key: 'displayName',  label: '名称' },
    { key: 'token',        label: 'Token' },
    { key: 'description',  label: '描述' },
    { key: 'descToken',    label: '描述Token' },
    { key: 'hidden',       label: '隐藏' },
    { key: 'icon',         label: '图标' },
    { key: 'iconGray',     label: '灰图标' },
  ];
  for (const lang of activeLanguages) {
    const info = COMMON_LANGUAGES.find(l => l.code === lang);
    const lbl = info ? info.label : lang;
    cols.push({ key: '__lang_disp_' + lang, label: lbl + '_名称' });
    cols.push({ key: '__lang_desc_' + lang, label: lbl + '_描述' });
  }
  return cols;
}

function getCellValue(a, key) {
  if (key.startsWith('__lang_disp_')) return a.langDisplay[key.slice('__lang_disp_'.length)] || '';
  if (key.startsWith('__lang_desc_')) return a.langDesc[key.slice('__lang_desc_'.length)] || '';
  if (key === 'hidden') return a.hidden ? 'true' : 'false';
  return a[key] != null ? String(a[key]) : '';
}

function buildColumnSelector() {
  const cols = getAllExportColumns();
  $('colList').innerHTML = cols.map(c =>
    '<label class="col-item"><input type="checkbox" value="' + c.key + '" checked> ' + esc(c.label) + '</label>'
  ).join('');
  $('colModal').classList.add('open');
}

$('exportBtn').addEventListener('click', () => {
  if (allAchievements.length === 0) return;
  buildColumnSelector();
});

$('colCancel').addEventListener('click', () => {
  $('colModal').classList.remove('open');
});

$('colExport').addEventListener('click', () => {
  const checked = [...$('colList').querySelectorAll('input:checked')].map(i => i.value);
  if (checked.length === 0) { toast('请至少选择一列', 'error'); return; }
  const cols = getAllExportColumns().filter(c => checked.includes(c.key));
  doExportCSV(cols);
  $('colModal').classList.remove('open');
});

function doExportCSV(cols) {
  const headerRow = cols.map(c => c.label);
  const dataRows = allAchievements.map(a =>
    cols.map(c => {
      const v = getCellValue(a, c.key);
      return v.includes(',') || v.includes('"') || v.includes('\n')
        ? '"' + v.replace(/"/g, '""') + '"' : v;
    })
  );
  const csv = [headerRow, ...dataRows].map(r => r.join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'achievements.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出 ' + allAchievements.length + ' 条记录', 'success');
}

// ============================================================
// CSV Import
// ============================================================

$('importBtn').addEventListener('click', () => {
  $('importFileInput').click();
});

$('importFileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) importCSV(file);
  e.target.value = '';
});

function parseCSV(text) {
  // Strip BOM
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  // Normalize line endings
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const rows = [];
  let currentRow = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (i + 1 < text.length && text[i+1] === '"') {
          field += '"'; i++;
        } else {
          inQuotes = false;
        }
      } else {
        field += c;
      }
    } else {
      if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        currentRow.push(field);
        field = '';
      } else if (c === '\n') {
        currentRow.push(field);
        field = '';
        rows.push(currentRow);
        currentRow = [];
      } else {
        field += c;
      }
    }
  }
  // Last field and row
  currentRow.push(field);
  if (currentRow.length > 1 || currentRow[0] !== '') rows.push(currentRow);
  return rows;
}

function importCSV(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const rows = parseCSV(e.target.result);
      if (rows.length < 2) { toast('CSV 文件格式错误: 没有数据行', 'error'); return; }

      const headers = rows[0];
      const dataRows = rows.slice(1);

      // Build column mapping to achievement fields
      // Column keys: ordinal, displayName, token, description, descToken, hidden, icon, iconGray
      //              __lang_disp_<code>, __lang_desc_<code>
      const colDefs = getAllExportColumns();
      const colMap = []; // { key, label }
      for (let i = 0; i < headers.length; i++) {
        const h = headers[i].trim();
        // Try exact label match first, then fallback to key pattern
        const def = colDefs.find(c => c.label === h);
        if (def) {
          colMap.push({ idx: i, key: def.key });
        }
      }

      if (colMap.length === 0) {
        toast('无法匹配 CSV 列与成就字段', 'error');
        return;
      }

      // Find ordinal column index
      const ordinalCol = colMap.find(c => c.key === 'ordinal');
      if (!ordinalCol) { toast('CSV 缺少 # 列（ordinal），无法匹配成就', 'error'); return; }

      // Build import data
      let updateCount = 0;
      const updates = [];
      for (const row of dataRows) {
        const ordStr = (row[ordinalCol.idx] || '').trim();
        if (!ordStr) continue;
        const ord = parseInt(ordStr, 10);
        if (isNaN(ord)) continue;
        const rowData = {};
        for (const cm of colMap) {
          rowData[cm.key] = (row[cm.idx] || '').trim();
        }
        updates.push({ ordinal: ord, data: rowData });
      }

      if (updates.length === 0) { toast('CSV 中没有可导入的有效数据', 'error'); return; }

      // Count how many will actually match existing achievements
      let matchCount = 0;
      for (const upd of updates) {
        if (allAchievements.some(a => a.ordinal === upd.ordinal)) matchCount++;
      }

      // Show preview modal
      const msg = '发现 ' + colMap.length + ' 列，' + updates.length + ' 行数据。\n其中 ' + matchCount + ' 条将匹配到现有成就。';
      $('importMsg').textContent = msg;
      $('importModal').classList.add('open');

      // Use onclick (not addEventListener) to avoid accumulation
      $('importConfirm').onclick = () => {
        $('importModal').classList.remove('open');
        $('importConfirm').onclick = null;
        $('importCancel').onclick = null;

        let applied = 0;
        for (const upd of updates) {
          const a = allAchievements.find(x => x.ordinal === upd.ordinal);
          if (!a) continue;
          const origIdx = allAchievements.indexOf(a);
          const orig = originalSnapshot[origIdx];

          for (const cm of colMap) {
            const key = cm.key;
            const val = upd.data[key];
            if (key === 'ordinal') continue;
            if (key === 'hidden') {
              a.hidden = val === 'true' || val === '1' || val === '✓';
            } else if (key.startsWith('__lang_disp_')) {
              const lang = key.slice('__lang_disp_'.length);
              a.langDisplay[lang] = val;
            } else if (key.startsWith('__lang_desc_')) {
              const lang = key.slice('__lang_desc_'.length);
              a.langDesc[lang] = val;
            } else if (key in a) {
              a[key] = val;
            }
          }

          if (isAchievementDirty(a, orig)) dirtyFlags.add(origIdx);
          applied++;
        }

        applyFilters();
        toast('已导入 ' + applied + ' 条记录', 'success');
      };

      $('importCancel').onclick = () => {
        $('importModal').classList.remove('open');
        $('importConfirm').onclick = null;
        $('importCancel').onclick = null;
      };

    } catch (err) {
      toast('导入失败: ' + err.message, 'error');
    }
  };
  reader.onerror = () => toast('读取文件失败', 'error');
  reader.readAsText(file);
}

// ============================================================
// Toast
// ============================================================

function toast(msg, type) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2500);
}

// Initial render
try {
  buildTableHead();
  renderLangBar();
  renderLangEditFields();
} catch (_) { /* initial render errors handled on subsequent loads */ }
</script>
